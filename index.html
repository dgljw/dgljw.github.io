<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FFF6E9">
<title>跳一跳</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #FFF6E9;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "WenQuanYi Micro Hei", sans-serif;
    user-select: none; -webkit-user-select: none;
    position: fixed; inset: 0;
  }
  #game { display: block; touch-action: none; cursor: pointer; }

  #score {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    font-size: 58px; font-weight: 800; color: #5A4640; line-height: 1;
    text-shadow: 0 2px 0 rgba(255,255,255,0.65);
    z-index: 5; pointer-events: none;
    transition: color 1.6s ease, text-shadow 1.6s ease;
  }
  #score.pop { animation: pop .32s ease; }
  @keyframes pop {
    0% { transform: translateX(-50%) scale(1); }
    40% { transform: translateX(-50%) scale(1.32); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #best {
    position: fixed; top: 28px; right: 26px; z-index: 5;
    color: #A08D7F; font-size: 14px; letter-spacing: 1px; pointer-events: none;
    transition: color 1.6s ease;
  }
  #hint {
    position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
    color: #8A7A6D; font-size: 15px; letter-spacing: 3px;
    z-index: 5; pointer-events: none; transition: opacity .6s, color 1.6s ease;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  body.night #score { color: #FFF6E9; text-shadow: 0 2px 10px rgba(130,100,255,0.55); }
  body.night #best { color: rgba(255,246,233,0.75); }
  body.night #hint { color: rgba(255,246,233,0.72); text-shadow: none; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 246, 233, 0.55);
    -webkit-backdrop-filter: blur(9px); backdrop-filter: blur(9px);
    transition: opacity .35s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .card {
    background: rgba(255,255,255,0.74);
    border: 1px solid rgba(255,255,255,0.65);
    border-radius: 28px; padding: 42px 58px; text-align: center;
    box-shadow: 0 24px 70px rgba(120, 80, 50, 0.22);
  }
  .title {
    font-size: 58px; font-weight: 900; margin: 0 0 12px; letter-spacing: 10px;
    background: linear-gradient(135deg, #FF8A4C, #FF5E8A 60%, #A66BC9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitle { margin: 0; color: #8A7A6D; font-size: 15px; letter-spacing: 2px; line-height: 1.9; }
  .big-score { font-size: 64px; font-weight: 900; color: #FF7A45; margin: 6px 0 2px; line-height: 1.1; }
  .over-title { font-size: 30px; font-weight: 800; color: #5A4640; margin: 0 0 4px; letter-spacing: 4px; }
  .best-line { color: #A08D7F; font-size: 14px; letter-spacing: 1px; margin: 4px 0 0; }
  .btn {
    appearance: none; border: none; cursor: pointer;
    margin-top: 24px; padding: 14px 48px;
    border-radius: 999px; font-size: 18px; font-weight: 700; letter-spacing: 4px;
    color: #fff; font-family: inherit;
    background: linear-gradient(135deg, #FF9A62, #FF6B8A);
    box-shadow: 0 10px 26px rgba(255, 107, 138, 0.38);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 14px 30px rgba(255,107,138,.45); }
  .btn:active { transform: scale(0.96); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">0</div>
<div id="best">最佳 0</div>
<div id="hint">按住蓄力 · 松开跳跃</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1 class="title">跳一跳</h1>
    <p class="subtitle">按住屏幕蓄力，松开起跳<br>落点越接近方块中心，得分越高</p>
    <button id="startBtn" class="btn">开始游戏</button>
  </div>
</div>

<div id="over" class="overlay hidden">
  <div class="card">
    <p class="over-title">游戏结束</p>
    <div id="overScore" class="big-score">0</div>
    <p id="overBest" class="best-line">历史最佳 0</p>
    <button id="restartBtn" class="btn">再来一局</button>
  </div>
</div>

<script>
'use strict';
/* ================= 基础工具 ================= */
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var scoreEl = document.getElementById('score');
var bestEl = document.getElementById('best');
var hintEl = document.getElementById('hint');
var menuEl = document.getElementById('menu');
var overEl = document.getElementById('over');
var overScoreEl = document.getElementById('overScore');
var overBestEl = document.getElementById('overBest');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');

var FONT = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif';
var BOX_H = 34;                 // 方块高度（世界单位）
var CHARGE_FULL = 1.1;          // 蓄满力所需秒数

var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function nowS() { return performance.now() / 1000; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function easeOutBack(u) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
}
function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

/* ================= 等距投影与相机 ================= */
// 世界坐标 (x, y, z) -> 投影坐标；+x 朝屏幕右上，+y 朝屏幕左上
function proj(x, y, z) { return { x: (x - y), y: -(x + y) * 0.5 - z }; }

var cam = { x: 0, y: 0 };
var camTX = 0, camTY = 0;
var shake = { x: 0, y: 0, m: 0 };

function S(p) {
  return { x: p.x - cam.x + W * 0.5 + shake.x, y: p.y - cam.y + H * 0.56 + shake.y };
}
function camTarget() {
  var a = proj(cur.x, cur.y, BOX_H);
  var b = proj(next.x, next.y, BOX_H);
  camTX = (a.x + b.x) / 2;
  camTY = (a.y + b.y) / 2;
}

/* ================= 配色与方块 ================= */
var PALETTE = [
  { top: '#FFC7B3', left: '#E2907A', right: '#F0A98F' }, // 珊瑚
  { top: '#B8EAD4', left: '#7FC4A4', right: '#9AD8BB' }, // 薄荷
  { top: '#CFC3F5', left: '#9C8DD4', right: '#B5A7E6' }, // 薰衣草
  { top: '#F7DFA8', left: '#D2AC66', right: '#E7C684' }, // 暖沙
  { top: '#ABD8F7', left: '#78ABD3', right: '#92C5E9' }, // 晴空
  { top: '#F9B8CD', left: '#D987A6', right: '#EB9FB9' }  // 玫瑰
];
// 幸运方块配色
var LUCKY_COL = {
  purple: { top: '#C4A6F7', left: '#8B62D6', right: '#A87FE6' },
  gold:   { top: '#FFE082', left: '#D9A330', right: '#F2C14E' }
};

var platforms = [];
var cur = null, next = null;

function addPlatform(x, y) {
  var type = Math.random() < 0.32 ? 'cyl' : 'box';
  var r = type === 'box' ? 27 + Math.random() * 12 : 23 + Math.random() * 8;
  var c;
  do { c = (Math.random() * PALETTE.length) | 0; }
  while (platforms.length && c === platforms[platforms.length - 1].c);
  var pf = { x: x, y: y, r: r, type: type, c: c, born: nowS(), die: 0, lucky: null };
  platforms.push(pf);
  return pf;
}
function spawnNext() {
  var base = platforms[platforms.length - 1];
  var gap = 95 + Math.random() * 105;
  var x = base.x, y = base.y;
  if (Math.random() < 0.5) { x += gap; } else { y += gap; }
  next = addPlatform(x, y);
  // 幸运方块：开局 5 步后才可能出现；紫色间隔至少 4 块；
  // 金色更稀有：间隔至少 8 块且概率更低，不会频繁出现
  spawnCount++;
  if (spawnCount >= 5) {
    sinceLucky++;
    var roll = Math.random();
    if (sinceLucky >= 8 && roll < 0.03) { next.lucky = 'gold'; sinceLucky = 0; }
    else if (sinceLucky >= 4 && roll < 0.12) { next.lucky = 'purple'; sinceLucky = 0; }
  }
  player.look = (next.x > cur.x) ? { x: 1, y: -0.7 } : { x: -1, y: -0.7 };
  camTarget();
}
function onPlat(pf, x, y) {
  var dx = x - pf.x, dy = y - pf.y;
  if (pf.type === 'cyl') { return dx * dx + dy * dy <= (pf.r + 2) * (pf.r + 2); }
  return Math.abs(dx) <= pf.r + 2 && Math.abs(dy) <= pf.r + 2;
}

/* ================= 角色与游戏状态 ================= */
var player = { x: 0, y: 0, z: BOX_H, rot: 0, sx: 1, sy: 1, look: { x: 1, y: -0.7 } };
var state = 'menu';      // menu | ready | charging | jumping | falling | over
var score = 0, combo = 0, best = 0;
var chargeT = 0;
var jump = null, fall = null;
var landTime = -10;
var particles = [], popups = [], rings = [];
var jumped = false;

/* ---------- 彩蛋与幸运方块 ---------- */
var nightMode = false;          // 星空模式（50 分彩蛋）
var nightBlend = 0;             // 昼夜过渡进度 0=日间 1=星空（平滑渐变，避免瞬间黑屏）
var egg20Done = false, egg50Done = false, egg200Done = false;
var eggFx = { t20: -10, t50: -10, t200: -10 }; // 彩蛋触发时刻（驱动仪式动画）
var fw = [], fwLeft = 0, fwTimer = 0;   // 200 分烟花（屏幕坐标：火箭与火花）
var confetti200 = [];                    // 200 分彩带雨（屏幕坐标）
var spawnCount = 0, sinceLucky = 0;
var shooting = [], shootTimer = 3;
var stars = [];
for (var si = 0; si < 80; si++) {
  stars.push({ x: Math.random(), y: Math.random() * 0.8, r: 0.5 + Math.random() * 1.4, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.8 });
}
var bokeh = [];
for (var bi = 0; bi < 12; bi++) {
  bokeh.push({ x: Math.random(), y: Math.random(), r: 14 + Math.random() * 42, v: 0.008 + Math.random() * 0.015, ph: Math.random() * 6.28 });
}

try { best = parseInt(localStorage.getItem('jump_best') || '0', 10) || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('jump_best', String(best)); } catch (e) {} }

function curPower() { return clamp(chargeT / CHARGE_FULL, 0, 1); }

function reset() {
  platforms.length = 0;
  particles.length = 0;
  popups.length = 0;
  rings.length = 0;
  score = 0; combo = 0;
  updateScoreUI(false);
  spawnCount = 0; sinceLucky = 0;
  cur = addPlatform(0, 0);
  cur.born = -10; // 首个方块不做入场动画
  spawnNext();
  player.x = cur.x; player.y = cur.y; player.z = BOX_H;
  player.rot = 0; player.sx = 1; player.sy = 1;
  jump = null; fall = null; chargeT = 0;
  state = 'ready';
  camTarget();
  cam.x = camTX; cam.y = camTY;
  hintEl.style.opacity = '1';
  jumped = false;
  nightMode = false;
  nightBlend = 0;
  egg20Done = false; egg50Done = false; egg200Done = false;
  eggFx.t20 = -10; eggFx.t50 = -10; eggFx.t200 = -10;
  shooting.length = 0; shootTimer = 3;
  fw.length = 0; fwLeft = 0; fwTimer = 0;
  confetti200.length = 0;
  try { document.body.classList.remove('night'); } catch (e) {}
}

function updateScoreUI(pop) {
  scoreEl.textContent = String(score);
  if (pop) {
    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
  }
}

/* ================= 音效（WebAudio 合成） ================= */
var audioCtx = null;
var chargeOsc = null, chargeGain = null;

function ensureAudio() {
  try {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { audioCtx = new AC(); }
    }
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
  } catch (e) { audioCtx = null; }
}
function tone(f, dur, type, vol, slide, delay) {
  if (!audioCtx) { return; }
  try {
    var t0 = audioCtx.currentTime + (delay || 0);
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur); }
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  } catch (e) {}
}
function startChargeSound() {
  if (!audioCtx) { return; }
  try {
    chargeOsc = audioCtx.createOscillator();
    chargeGain = audioCtx.createGain();
    chargeOsc.type = 'sine';
    chargeOsc.frequency.setValueAtTime(160, audioCtx.currentTime);
    chargeOsc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + CHARGE_FULL + 0.05);
    chargeGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    chargeGain.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.08);
    chargeOsc.connect(chargeGain);
    chargeGain.connect(audioCtx.destination);
    chargeOsc.start();
  } catch (e) { chargeOsc = null; chargeGain = null; }
}
function stopChargeSound() {
  if (chargeOsc) {
    try {
      chargeGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
      chargeOsc.stop(audioCtx.currentTime + 0.09);
    } catch (e) {}
    chargeOsc = null; chargeGain = null;
  }
}

/* ================= 输入与流程 ================= */
function startCharge() {
  if (state !== 'ready') { return; }
  ensureAudio();
  state = 'charging';
  chargeT = 0;
  startChargeSound();
}
function release() {
  if (state !== 'charging') { return; }
  stopChargeSound();
  var p = curPower();
  // 起跳方向 = 角色当前位置 -> 下一方块中心：
  // 即使没站在方块正中心（尤其拐弯处），轨迹也始终瞄准下一块中心，力道合适就能修正回中心，
  // 而不是沿着两方块中心的平行线把偏移永远带下去
  var dx = next.x - player.x, dy = next.y - player.y;
  var len = Math.hypot(dx, dy) || 1;
  var dist = 30 + p * 235;
  jump = {
    fx: player.x, fy: player.y,
    tx: player.x + dx / len * dist, ty: player.y + dy / len * dist,
    t: 0, T: 0.42 + 0.3 * p, H: 55 + 70 * p
  };
  state = 'jumping';
  tone(240, 0.22, 'sine', 0.12, 520);
  if (!jumped) { jumped = true; hintEl.style.opacity = '0'; }
}
function onPress() {
  if (state === 'menu') { startGame(); return; }
  if (state === 'over') { restart(); return; }
  startCharge();
}
function onRelease() { release(); }

function land() {
  var px = jump.tx, py = jump.ty;
  player.x = px; player.y = py; player.z = BOX_H;
  player.rot = 0; player.sx = 1; player.sy = 1;
  landTime = nowS();

  if (onPlat(next, px, py)) {
    var d = Math.hypot(px - next.x, py - next.y);
    var perfect = d <= 9;
    var add;
    if (perfect) { combo += 1; add = 2 * combo; } else { combo = 0; add = 1; }
    score += add;
    updateScoreUI(true);
    popups.push({
      x: px, y: py, z: BOX_H + 30, age: 0,
      text: perfect ? '完美 +' + add : '+' + add,
      color: perfect ? '#FF7A2F' : '#8A7A6D'
    });
    if (perfect) { rings.push({ pf: next, age: 0 }); }
    dust(px, py, perfect ? 16 : 9, perfect);
    shake.m = perfect ? 6 : 3;
    if (perfect) {
      tone(784, 0.3, 'sine', 0.13, null, 0);
      tone(1174.7, 0.4, 'sine', 0.11, null, 0.07);
    } else {
      tone(320, 0.15, 'triangle', 0.13, 190);
    }
    // 幸运方块暴击
    if (next.lucky) {
      var kind = next.lucky;
      var bonus = kind === 'gold' ? (10 + ((Math.random() * 11) | 0)) : ((Math.random() * 11) | 0);
      score += bonus;
      updateScoreUI(true);
      next.lucky = null;
      luckyBurst(px, py, kind);
      popups.push({
        x: px, y: py, z: BOX_H + 56, age: 0, big: true,
        text: bonus > 0 ? '幸运暴击 +' + bonus : '幸运方块 · 哑火',
        color: kind === 'gold' ? '#F5A623' : '#9B5DE5'
      });
      shake.m = 7;
      if (kind === 'gold') {
        tone(880, 0.12, 'sine', 0.12);
        tone(1108.7, 0.12, 'sine', 0.12, null, 0.09);
        tone(1318.5, 0.32, 'sine', 0.13, null, 0.18);
      } else {
        tone(659.3, 0.15, 'sine', 0.12);
        tone(880, 0.28, 'sine', 0.12, null, 0.1);
      }
    }
    checkMilestones();
    cur.die = nowS();
    cur = next;
    spawnNext();
    state = 'ready';
  } else if (onPlat(cur, px, py)) {
    // 跳回原方块：安全但不得分
    dust(px, py, 6, false);
    tone(200, 0.12, 'triangle', 0.1);
    state = 'ready';
  } else {
    state = 'falling';
    var inv = 1 / jump.T;
    fall = {
      vx: (jump.tx - jump.fx) * inv * 0.3,
      vy: (jump.ty - jump.fy) * inv * 0.3,
      vz: -4 * jump.H / jump.T
    };
    tone(700, 0.6, 'sine', 0.1, 130);
  }
}
function gameOver() {
  if (state === 'over') { return; }
  state = 'over';
  best = Math.max(best, score);
  saveBest();
  bestEl.textContent = '最佳 ' + best;
  overScoreEl.textContent = String(score);
  overBestEl.textContent = '历史最佳 ' + best;
  show(overEl);
  tone(392, 0.22, 'triangle', 0.12, null, 0);
  tone(311, 0.22, 'triangle', 0.12, null, 0.18);
  tone(233, 0.5, 'triangle', 0.13, null, 0.36);
}
function startGame() {
  if (state !== 'menu') { return; }
  ensureAudio();
  hide(menuEl);
  state = 'ready';
  tone(523, 0.15, 'sine', 0.1);
  tone(784, 0.2, 'sine', 0.1, null, 0.1);
}
function restart() {
  if (state !== 'over') { return; }
  ensureAudio();
  hide(overEl);
  reset();
}

startBtn.addEventListener('click', function () {
  startGame();
  try { if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); } } catch (e) {}
});
restartBtn.addEventListener('click', function () {
  restart();
  try { if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); } } catch (e) {}
});
window.addEventListener('pointerdown', function (e) {
  if (e.target && e.target.closest && e.target.closest('button')) { return; }
  e.preventDefault();
  onPress();
});
window.addEventListener('pointerup', function () { onRelease(); });
window.addEventListener('pointercancel', function () { onRelease(); });
window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (!e.repeat) { onPress(); }
  }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'Space' || e.key === ' ') { onRelease(); }
});
window.addEventListener('blur', function () {
  if (state === 'charging') { stopChargeSound(); state = 'ready'; }
});
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ================= 粒子 / 飘字 / 光圈 ================= */
function dust(x, y, n, golden) {
  for (var i = 0; i < n; i++) {
    particles.push({
      x: x + rnd(-10, 10), y: y + rnd(-10, 10), z: BOX_H + rnd(0, 4),
      vx: rnd(-46, 46), vy: rnd(-46, 46), vz: rnd(40, 110),
      age: 0, life: rnd(0.35, 0.6), r: rnd(1.8, 4),
      c: golden ? (Math.random() < 0.5 ? '#FFC24D' : '#FFE08A') : 'rgba(255,255,255,0.95)'
    });
  }
}
// 幸运方块暴击粒子爆发
function luckyBurst(x, y, kind) {
  var n = kind === 'gold' ? 28 : 18;
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = rnd(30, 120);
    particles.push({
      x: x, y: y, z: BOX_H + rnd(2, 10),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: rnd(60, 170),
      age: 0, life: rnd(0.5, 0.9), r: rnd(2, 4.5),

    });

}

/* ================= 更新 ================= */
var clouds = [];
for (var ci = 0; ci < 6; ci++) {
  clouds.push({ x: Math.random(), y: Math.random(), s: 60 + Math.random() * 90, v: 0.004 + Math.random() * 0.008 });
}

function update(dt) {
  var t = nowS();
  // 相机平滑跟随（稍快一些，手感更跟手）
  var k = Math.min(1, dt * 6.5);
  cam.x += (camTX - cam.x) * k;
  cam.y += (camTY - cam.y) * k;
  // 震屏衰减
  shake.m = Math.max(0, shake.m - dt * 22);
  shake.x = (Math.random() * 2 - 1) * shake.m;
  shake.y = (Math.random() * 2 - 1) * shake.m;
  // 云朵漂移
  for (var i = 0; i < clouds.length; i++) {
    clouds[i].x += clouds[i].v * dt;
    if (clouds[i].x > 1.15) { clouds[i].x = -0.15; }
  }
  // 光斑上浮
  for (var bo = 0; bo < bokeh.length; bo++) {
    bokeh[bo].y -= bokeh[bo].v * dt;
    if (bokeh[bo].y < -0.12) { bokeh[bo].y = 1.12; bokeh[bo].x = Math.random(); }
  }
  // 星空模式：流星
  if (nightMode) {
    shootTimer -= dt;
    if (shootTimer <= 0) {
      shootTimer = rnd(2.5, 6);
      var dir = Math.random() < 0.5 ? 1 : -1;
      shooting.push({
        x: rnd(0.15, 0.85) * W, y: rnd(0.05, 0.3) * H,
        vx: dir * rnd(260, 430), vy: rnd(120, 220),
        age: 0, life: 0.7
      });
    }
    for (var shi = shooting.length - 1; shi >= 0; shi--) {
      var st = shooting[shi];
      st.age += dt;
      if (st.age < 0) { continue; } // 延迟出场（流星雨错峰）
      if (st.age >= st.life) { shooting.splice(shi, 1); continue; }
      st.x += st.vx * dt;
      st.y += st.vy * dt;
    }
    // 星空模式：小猫星光拖尾
    if ((state === 'jumping' || state === 'charging' || state === 'ready') && Math.random() < dt * (state === 'jumping' ? 46 : 9)) {
      particles.push({
        x: player.x + rnd(-9, 9), y: player.y + rnd(-9, 9), z: player.z + rnd(2, 26),
        vx: rnd(-14, 14), vy: rnd(-14, 14), vz: rnd(6, 30),
        age: 0, life: rnd(0.4, 0.8), r: rnd(1.2, 2.6),
        c: Math.random() < 0.5 ? '#FFE9A8' : '#CBB6FF',
        star: Math.random() < 0.5
      });
    }
  }
  // 昼夜平滑过渡（50 分彩蛋：星空缓缓浮现，不会一瞬间黑屏）
  nightBlend = clamp(nightBlend + (nightMode ? dt / 2.4 : -dt / 1.2), 0, 1);
  // 200 分庆典：烟花排队升空 + 彩带雨生成
  var e200 = t - eggFx.t200;
  if (e200 >= 0 && e200 < 4.6) {
    if (fwLeft > 0) {
      fwTimer -= dt;
      if (fwTimer <= 0) {
        fwLeft--;
        fwTimer = rnd(0.14, 0.42);
        fw.push({ kind: 'rocket', x: rnd(0.14, 0.86) * W, y: H + 8, ty: rnd(0.14, 0.4) * H, vy: -rnd(560, 760), hue: rnd(0, 360) });
      }
    }
    if (e200 < 3.4 && Math.random() < dt * 30) {
      confetti200.push({
        x: rnd(0, W), y: -14, vx: rnd(-26, 26), vy: rnd(95, 185),
        rot: rnd(0, 6.28), vr: rnd(-5, 5), w: rnd(4.5, 8.5), h: rnd(8, 15), hue: rnd(0, 360)
      });
    }
  }
  for (var fi = fw.length - 1; fi >= 0; fi--) {
    var f = fw[fi];
    if (f.kind === 'rocket') {
      f.y += f.vy * dt;
      if (Math.random() < dt * 40) {
        fw.push({ kind: 'spark', x: f.x + rnd(-2, 2), y: f.y + rnd(0, 8), vx: rnd(-14, 14), vy: rnd(30, 80), age: 0, life: rnd(0.25, 0.45), hue: f.hue, r: rnd(1, 2) });
      }
      if (f.y <= f.ty) {
        var fn = 46 + ((Math.random() * 18) | 0);
        for (var fj = 0; fj < fn; fj++) {
          var fa = Math.random() * Math.PI * 2;
          var fs = rnd(50, 270);
          fw.push({ kind: 'spark', x: f.x, y: f.y, vx: Math.cos(fa) * fs, vy: Math.sin(fa) * fs * 0.85, age: 0, life: rnd(0.8, 1.6), hue: f.hue + rnd(-28, 28), r: rnd(1.6, 3.2) });
        }
        fw.splice(fi, 1);
      }
    } else {
      f.age += dt;
      if (f.age >= f.life) { fw.splice(fi, 1); continue; }
      f.vy += 230 * dt;
      f.vx *= (1 - dt * 0.6);
      f.x += f.vx * dt; f.y += f.vy * dt;
    }
  }
  for (var cfi = confetti200.length - 1; cfi >= 0; cfi--) {
    var cf = confetti200[cfi];
    cf.rot += cf.vr * dt;
    cf.x += cf.vx * dt + Math.sin(t * 2.4 + cf.rot) * 18 * dt;
    cf.y += cf.vy * dt;
    if (cf.y > H + 20) { confetti200.splice(cfi, 1); }
  }
  // 200 分后：小猫彩虹拖尾（本局持续，炫彩到底）
  if (egg200Done && (state === 'jumping' || state === 'charging' || state === 'ready') && Math.random() < dt * (state === 'jumping' ? 50 : 10)) {
    particles.push({
      x: player.x + rnd(-9, 9), y: player.y + rnd(-9, 9), z: player.z + rnd(2, 26),
      vx: rnd(-16, 16), vy: rnd(-16, 16), vz: rnd(8, 34),
      age: 0, life: rnd(0.4, 0.85), r: rnd(1.4, 2.8),
      c: 'hsl(' + ((t * 260 + Math.random() * 80) % 360) + ',92%,64%)',
      star: Math.random() < 0.55
    });
  }
  // 幸运方块周围的环境微粒
  for (var li = 0; li < platforms.length; li++) {
    var lpf = platforms[li];
    if (lpf.lucky && !lpf.die && Math.random() < dt * 4) {
      particles.push({
        x: lpf.x + rnd(-0.6, 0.6) * lpf.r, y: lpf.y + rnd(-0.6, 0.6) * lpf.r,
        z: BOX_H + rnd(2, 8), vx: rnd(-8, 8), vy: rnd(-8, 8), vz: rnd(18, 44),
        age: 0, life: rnd(0.5, 0.9), r: rnd(1.2, 2.6),
        c: lpf.lucky === 'gold' ? '#FFD76A' : '#C9A6FF'
      });
    }
  }

  if (state === 'charging') {
    chargeT += dt;
    player.z = BOX_H * (1 - 0.12 * curPower());
  } else if (state === 'jumping' && jump) {
    jump.t += dt;
    var s = Math.min(1, jump.t / jump.T);
    player.x = jump.fx + (jump.tx - jump.fx) * s;
    player.y = jump.fy + (jump.ty - jump.fy) * s;
    player.z = BOX_H + 4 * jump.H * s * (1 - s);
    player.rot = s * Math.PI * 2;
    player.sx = 0.94; player.sy = 1.1;
    if (s >= 1) { land(); }
  } else if (state === 'falling' && fall) {
    fall.vz -= 1500 * dt;
    player.z += fall.vz * dt;
    player.x += fall.vx * dt;
    player.y += fall.vy * dt;
    player.rot += dt * 7;
    if (player.z < -300) { gameOver(); }
  } else if (state === 'ready') {
    player.z = BOX_H;
    player.rot = 0;
  }

  // 粒子
  for (var pi = particles.length - 1; pi >= 0; pi--) {
    var p = particles[pi];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(pi, 1); continue; }
    p.vz -= 320 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
  }
  for (var qi = popups.length - 1; qi >= 0; qi--) {
    popups[qi].age += dt;
    if (popups[qi].age > 0.9) { popups.splice(qi, 1); }
  }
  for (var ri = rings.length - 1; ri >= 0; ri--) {
    rings[ri].age += dt;
    if (rings[ri].age > 0.5) { rings.splice(ri, 1); }
  }
  // 移除已沉没的旧方块
  for (var di = platforms.length - 1; di >= 0; di--) {
    var pf = platforms[di];
    if (pf.die && t - pf.die > 0.5) { platforms.splice(di, 1); }
  }
}

/* ================= 绘制 ================= */
function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    var cx = c.x * (W + 400) - 200;
    var cy = 50 + c.y * H * 0.45;
    ctx.beginPath();
    ctx.ellipse(cx, cy, c.s, c.s * 0.3, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + c.s * 0.55, cy + c.s * 0.08, c.s * 0.55, c.s * 0.2, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - c.s * 0.5, cy + c.s * 0.1, c.s * 0.5, c.s * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBox(pf, col, k, h, zOff) {
  var r = pf.r * k, x = pf.x, y = pf.y;
  var A = S(proj(x - r, y - r, h + zOff));
  var B = S(proj(x + r, y - r, h + zOff));
  var C = S(proj(x + r, y + r, h + zOff));
  var D = S(proj(x - r, y + r, h + zOff));
  var Ab = S(proj(x - r, y - r, zOff));
  var Bb = S(proj(x + r, y - r, zOff));
  var Db = S(proj(x - r, y + r, zOff));
  // 左侧面
  ctx.fillStyle = col.left;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y); ctx.lineTo(D.x, D.y);
  ctx.lineTo(Db.x, Db.y); ctx.lineTo(Ab.x, Ab.y);
  ctx.closePath(); ctx.fill();
  // 右侧面
  ctx.fillStyle = col.right;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
  ctx.lineTo(Bb.x, Bb.y); ctx.lineTo(Ab.x, Ab.y);
  ctx.closePath(); ctx.fill();
  // 顶面
  ctx.fillStyle = col.top;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawCyl(pf, col, k, h, zOff) {
  var r = pf.r * k;
  var rx = r * 1.414, ry = r * 0.707;
  var ct = S(proj(pf.x, pf.y, h + zOff));
  var cb = S(proj(pf.x, pf.y, zOff));
  var grad = ctx.createLinearGradient(ct.x - rx, 0, ct.x + rx, 0);
  grad.addColorStop(0, col.left);
  grad.addColorStop(1, col.right);
  // 侧面
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(ct.x - rx, ct.y);
  ctx.lineTo(cb.x - rx, cb.y);
  ctx.ellipse(cb.x, cb.y, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(ct.x + rx, ct.y);
  ctx.ellipse(ct.x, ct.y, rx, ry, 0, 0, Math.PI, false);
  ctx.closePath();
  ctx.fill();
  // 顶面
  ctx.fillStyle = col.top;
  ctx.beginPath();
  ctx.ellipse(ct.x, ct.y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawPlatform(pf) {
  var t = nowS();
  var k = 1, zOff = 0, alpha = 1;
  var bu = clamp((t - pf.born) / 0.4, 0, 1);
  if (bu < 1) { k = easeOutBack(bu); zOff = (1 - bu) * 70; }
  if (pf.die) {
    var du = clamp((t - pf.die) / 0.45, 0, 1);
    if (du >= 1) { return; }
    alpha = 1 - du;
    zOff = -du * 46;
  }
  var hs = (pf === cur && state === 'charging') ? (1 - 0.12 * curPower()) : 1;
  var h = BOX_H * hs;
  var col = pf.lucky ? LUCKY_COL[pf.lucky] : PALETTE[pf.c];
  ctx.globalAlpha = alpha;
  if (pf.type === 'box') { drawBox(pf, col, k, h, zOff); }
  else { drawCyl(pf, col, k, h, zOff); }
  if (pf.lucky) { drawLuckyFX(pf, k, h, zOff); }
  if (nightMode) { drawNightGlow(pf, h, zOff); }
  ctx.globalAlpha = 1;
}

// 星空模式：方块顶面霓虹呼吸光边（随昼夜过渡淡入，过渡期方块依然醒目）
function drawNightGlow(pf, h, zOff) {
  var t = nowS();
  var nb = nightBlend * nightBlend * (3 - 2 * nightBlend);
  var pulse = 0.5 + 0.32 * Math.sin(t * 2.2 + pf.x * 0.04 + pf.y * 0.04);
  var rgb = pf.lucky === 'gold' ? '255,210,110' : (pf.lucky === 'purple' ? '190,150,255' : '150,130,255');
  ctx.save();
  ctx.globalAlpha *= pulse * (0.35 + 0.65 * nb);
  ctx.strokeStyle = 'rgba(' + rgb + ',0.9)';
  ctx.lineWidth = 2.4;
  ctx.shadowColor = 'rgba(' + rgb + ',1)';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  topFacePath(pf, h + zOff);
  ctx.stroke();
  ctx.restore();
}

// 幸运方块特效：呼吸光晕 + 星形印记 + 环绕微光
function drawLuckyFX(pf, k, h, zOff) {
  var t = nowS();
  var gold = pf.lucky === 'gold';
  var c = S(proj(pf.x, pf.y, h + zOff));
  var pulse = 0.75 + 0.25 * Math.sin(t * 3 + pf.x * 0.05);
  var glowRGB = gold ? '255,200,80' : '178,130,255';
  // 顶面光晕（等距椭圆）
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(1, 0.5);
  var R = pf.r * k * 2.1 * (1 + 0.06 * Math.sin(t * 3));
  var gg = ctx.createRadialGradient(0, 0, pf.r * k * 0.4, 0, 0, R);
  gg.addColorStop(0, 'rgba(' + glowRGB + ',' + (0.4 * pulse).toFixed(3) + ')');
  gg.addColorStop(1, 'rgba(' + glowRGB + ',0)');
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // 环绕微光
  var n = gold ? 3 : 2;
  for (var i = 0; i < n; i++) {
    var a = t * 1.8 + i * Math.PI * 2 / n;
    var ox = Math.cos(a) * pf.r * k * 1.05;
    var oy = Math.sin(a) * pf.r * k * 0.52;
    drawSparkle(c.x + ox, c.y + oy - 4, 3 + Math.sin(t * 5 + i) * 0.8, 'rgba(255,255,255,0.85)');
  }
  // 中央星形印记
  drawSparkle(c.x, c.y - 6, 7.5 + Math.sin(t * 4) * 1.1, gold ? 'rgba(255,250,220,0.95)' : 'rgba(245,238,255,0.95)');
}

// 四角星小闪光
function drawSparkle(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.18, y - s * 0.18, x + s, y);
  ctx.quadraticCurveTo(x + s * 0.18, y + s * 0.18, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.18, y + s * 0.18, x - s, y);
  ctx.quadraticCurveTo(x - s * 0.18, y - s * 0.18, x, y - s);
  ctx.closePath();
  ctx.fill();
}

// 只绘制属于指定方块的光圈（配合深度排序）
function drawRingsFor(pf) {
  for (var i = 0; i < rings.length; i++) {
    var rg = rings[i];
    if (rg.pf !== pf) { continue; }
    var u = rg.age / 0.5;
    var rr = pf.r * (1 + u * 1.6);
    var p1 = S(proj(pf.x - rr, pf.y - rr, BOX_H + 1));
    var p2 = S(proj(pf.x + rr, pf.y - rr, BOX_H + 1));
    var p3 = S(proj(pf.x + rr, pf.y + rr, BOX_H + 1));
    var p4 = S(proj(pf.x - rr, pf.y + rr, BOX_H + 1));
    ctx.globalAlpha = (1 - u) * 0.9;
    ctx.strokeStyle = '#FFB347';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// 方块顶面路径（用于阴影裁剪）
function topFacePath(pf, zTop) {
  var r = pf.r;
  if (pf.type === 'cyl') {
    var c = S(proj(pf.x, pf.y, zTop));
    ctx.ellipse(c.x, c.y, r * 1.414, r * 0.707, 0, 0, Math.PI * 2);
  } else {
    var p1 = S(proj(pf.x - r, pf.y - r, zTop));
    var p2 = S(proj(pf.x + r, pf.y - r, zTop));
    var p3 = S(proj(pf.x + r, pf.y + r, zTop));
    var p4 = S(proj(pf.x - r, pf.y + r, zTop));
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
  }
}

function drawShadow() {
  if (state === 'over') { return; }
  var pf = null, surfZ = BOX_H;
  if (onPlat(cur, player.x, player.y)) {
    pf = cur;
    surfZ = BOX_H * ((state === 'charging') ? (1 - 0.12 * curPower()) : 1);
  } else if (onPlat(next, player.x, player.y)) {
    pf = next;
  }
  if (!pf) { return; }
  // 坠落时阴影快速淡出，不再留在方块上
  var fade = 1;
  if (state === 'falling') {
    fade = clamp(1 - (BOX_H - player.z) / 70, 0, 1);
    if (fade <= 0) { return; }
  }
  var dz = Math.max(0, player.z - surfZ);
  var k = Math.max(0.45, 1 - dz / 320);
  var a = (0.3 * k + 0.06) * fade;
  var pos = S(proj(player.x, player.y, surfZ + 0.5));
  var R = 20 * k * 1.5;
  // 将阴影裁剪到方块顶面内，身体悬空在边缘外时不会溢出
  ctx.save();
  ctx.beginPath();
  topFacePath(pf, surfZ);
  ctx.clip();
  ctx.translate(pos.x, pos.y);
  ctx.scale(1, 0.5);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, 'rgba(70,45,35,' + a.toFixed(3) + ')');
  g.addColorStop(0.6, 'rgba(70,45,35,' + (a * 0.5).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(70,45,35,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  var pos = S(proj(player.x, player.y, player.z));
  var t = nowS();
  var sx = player.sx, sy = player.sy;
  if (state === 'ready') {
    var lu = (t - landTime) / 0.3;
    if (lu < 1) { sy *= 1 - 0.28 * Math.sin(Math.PI * lu); }
    else { sy *= 1 + Math.sin(t * 2.4) * 0.012; }
  } else if (state === 'charging') {
    var pw = curPower();
    sy = 1 - 0.36 * pw;
    sx = 1 + 0.3 * pw;
  }
  ctx.save();
  ctx.translate(pos.x, pos.y);
  ctx.scale(sx, sy);
  if (player.rot) {
    ctx.translate(0, -22);
    ctx.rotate(player.rot);
    ctx.translate(0, 22);
  }
  var lx = player.look.x, ly = player.look.y;

  // 尾巴（在身体后方，轻轻摆动，蓄力时摇得更快）
  var wag = Math.sin(t * (state === 'charging' ? 14 : 5)) * 0.5;
  ctx.save();
  ctx.translate(10, -8);
  ctx.rotate(-0.5 + wag);
  ctx.strokeStyle = '#E08A33';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(9, -4, 11, -13);

  // 身体
  var bg = ctx.createLinearGradient(0, -40, 0, 2);
  bg.addColorStop(0, '#F7AC55');
  bg.addColorStop(1, '#E8923C');

  ctx.beginPath();
  ctx.moveTo(-13, -2);
  ctx.bezierCurveTo(-14, -16, -8, -22, 0, -22);
  ctx.bezierCurveTo(8, -22, 14, -16, 13, -2);
  ctx.quadraticCurveTo(0, 3, -13, -2);
  ctx.closePath();
  ctx.fill();

  // 耳朵（外耳）
  ctx.fillStyle = '#F09A40';
  ctx.beginPath();
  ctx.moveTo(-11, -37);
  ctx.lineTo(-14, -49);
  ctx.lineTo(-3.5, -42.5);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(11, -37);
  ctx.lineTo(14, -49);
  ctx.lineTo(3.5, -42.5);
  ctx.closePath();
  ctx.fill();
  // 内耳
  ctx.fillStyle = '#FFB3C1';
  ctx.beginPath();
  ctx.moveTo(-10.4, -39.5);
  ctx.lineTo(-12.2, -46.5);
  ctx.lineTo(-5.8, -42.6);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10.4, -39.5);
  ctx.lineTo(12.2, -46.5);
  ctx.lineTo(5.8, -42.6);
  ctx.closePath();
  ctx.fill();

  // 头部
  var hg = ctx.createLinearGradient(0, -44, 0, -18);
  hg.addColorStop(0, '#F9B45F');
  hg.addColorStop(1, '#EF9A42');

  ctx.beginPath();
  ctx.arc(0, -31, 12.8, 0, Math.PI * 2);

  // 额头条纹
  ctx.strokeStyle = 'rgba(200,110,35,0.55)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2.5, -43.5); ctx.lineTo(-2, -39.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2.5, -43.5); ctx.lineTo(2, -39.5); ctx.stroke();

  // 嘴部浅色毛
  ctx.fillStyle = '#FFF3DE';
  ctx.beginPath();
  ctx.ellipse(0, -26.2, 6.4, 4.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // 眼睛（偶尔眨眼，视线朝向下一个方块）
  var blink = (t % 3.4) > 3.25;
  var ex = lx * 1.2, ey = ly * 0.8;
  if (blink) {
    ctx.strokeStyle = '#4A3123';
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-7, -32); ctx.lineTo(-3, -32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -32); ctx.lineTo(7, -32); ctx.stroke();
  } else {
    ctx.fillStyle = '#4A3123';
    ctx.beginPath(); ctx.arc(-5 + ex, -32 + ey, 2.3, 0, Math.PI * 2); ctx.fill();

  ctx.beginPath(); ctx.ellipse(8.4, -28.6, 2.2, 1.4, 0, 0, Math.PI * 2); ctx.fill();

  // 前爪
  ctx.fillStyle = '#F9B45F';

  ctx.restore();
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var a = Math.max(0, 1 - p.age / p.life);
    var pos = S(proj(p.x, p.y, p.z));
    ctx.globalAlpha = a * 0.9;
    ctx.fillStyle = p.c;
    if (p.star) { drawSparkle(pos.x, pos.y, p.r * 2.1, p.c); }
    else {
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  for (var i = 0; i < popups.length; i++) {
    var p = popups[i];
    var a = Math.max(0, 1 - p.age / 0.9);
    var pos = S(proj(p.x, p.y, p.z + p.age * 46));
    ctx.globalAlpha = a;
    ctx.font = (p.big ? '800 27px ' : '700 22px ') + FONT;
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, pos.x, pos.y);
  }
  ctx.globalAlpha = 1;
}

function drawPowerRing() {
  var pw = curPower();
  if (pw <= 0.01) { return; }
  var pos = S(proj(player.x, player.y, player.z));
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = 'hsl(' + (140 - 105 * pw) + ', 72%, 58%)';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.shadowColor = ctx.strokeStyle;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(pos.x, pos.y - 23, 36, -Math.PI / 2, -Math.PI / 2 + pw * Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* ================= 背景绘制 ================= */
function aurora(x, y, r, color) {
  var g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function drawBokeh() {
  var t = nowS();
  for (var i = 0; i < bokeh.length; i++) {
    var b = bokeh[i];
    var bx = b.x * W + Math.sin(t * 0.3 + b.ph) * 22;
    var by = b.y * H;
    var nb = nightBlend * nightBlend * (3 - 2 * nightBlend);
    var a = 0.14 - 0.04 * nb;
    var col = Math.round(255 - 90 * nb) + ',' + Math.round(255 - 110 * nb) + ',255';
    var g = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
    g.addColorStop(0, 'rgba(' + col + ',' + a + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(bx, by, b.r, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawStars(t) {
  ctx.fillStyle = '#FFFFFF';
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.globalAlpha = 0.25 + 0.6 * Math.abs(Math.sin(t * s.sp + s.ph));
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawShootingStars() {
  for (var i = 0; i < shooting.length; i++) {
    var s = shooting[i];
    if (s.age < 0) { continue; }
    var a = clamp(1 - s.age / s.life, 0, 1);
    var tx = s.x - s.vx * 0.13, ty = s.y - s.vy * 0.13;
    var g = ctx.createLinearGradient(s.x, s.y, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,' + (0.9 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = g;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();
  }
}
function drawDayScene() {
  // 日间：奶油 → 蜜桃 → 淡紫的多层渐变
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#FFF9F0');
  g.addColorStop(0.45, '#FFE8D1');
  g.addColorStop(0.75, '#F6D3C8');
  g.addColorStop(1, '#DCC5EC');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // 日晕
  var sg = ctx.createRadialGradient(W * 0.78, H * 0.16, 10, W * 0.78, H * 0.16, Math.max(W, H) * 0.5);
  sg.addColorStop(0, 'rgba(255,240,200,0.95)');
  sg.addColorStop(0.4, 'rgba(255,225,180,0.35)');
  sg.addColorStop(1, 'rgba(255,225,180,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, W, H);
  // 极光色块
  aurora(W * 0.12, H * 0.28, Math.max(W, H) * 0.35, 'rgba(255,175,165,0.16)');
  aurora(W * 0.92, H * 0.72, Math.max(W, H) * 0.4, 'rgba(175,155,255,0.15)');
  aurora(W * 0.45, H * 0.98, Math.max(W, H) * 0.45, 'rgba(255,205,150,0.12)');
  drawClouds();
  drawBokeh();
}
function drawNightScene(t) {
  // 星空模式（彩蛋）
  var ng = ctx.createLinearGradient(0, 0, 0, H);
  ng.addColorStop(0, '#1B1836');
  ng.addColorStop(0.5, '#34295C');
  ng.addColorStop(1, '#5C4270');
  ctx.fillStyle = ng;
  ctx.fillRect(0, 0, W, H);
  // 月晕 + 月亮
  var mx = W * 0.8, my = H * 0.15;
  var mg = ctx.createRadialGradient(mx, my, 6, mx, my, Math.max(W, H) * 0.4);
  mg.addColorStop(0, 'rgba(205,195,255,0.5)');
  mg.addColorStop(1, 'rgba(205,195,255,0)');
  ctx.fillStyle = mg;
  ctx.fillRect(0, 0, W, H);
  var md = ctx.createRadialGradient(mx, my, 2, mx, my, 46);
  md.addColorStop(0, 'rgba(248,244,255,0.95)');
  md.addColorStop(0.3, 'rgba(230,220,255,0.5)');
  md.addColorStop(1, 'rgba(230,220,255,0)');
  ctx.fillStyle = md;
  ctx.beginPath(); ctx.arc(mx, my, 46, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#F6F1FF';
  ctx.beginPath(); ctx.arc(mx, my, 12, 0, Math.PI * 2); ctx.fill();
  aurora(W * 0.2, H * 0.8, Math.max(W, H) * 0.45, 'rgba(120,90,220,0.16)');
  aurora(W * 0.85, H * 0.55, Math.max(W, H) * 0.4, 'rgba(80,140,220,0.12)');
  drawStars(t);
  drawShootingStars();
  drawBokeh();
}
function drawBackground() {
  var t = nowS();
  drawDayScene();
  if (nightBlend > 0.004) {
    // 日 -> 夜交叉淡化：星空在约 2.4 秒内缓缓浮现，方块始终可见
    var nb = nightBlend * nightBlend * (3 - 2 * nightBlend);
    ctx.save();
    ctx.globalAlpha = nb;
    drawNightScene(t);
    ctx.restore();
  }
}

// 计算角色的有效绘制深度。
// 角色站在方块顶面时（待机/蓄力/起跳），几何上不可能被该方块遮挡，
// 因此把深度钳制到不深于该方块中心，避免落在方块前半侧时角色被顶面"吞掉"（看起来像卡在方块里）。
// 坠落/结束时不钳制，保证跳过头下落时方块仍能正确遮挡角色。
function playerDepth() {
  var pd = player.x + player.y;
  if (state === 'ready' || state === 'charging' || state === 'jumping' || state === 'menu') {
    if (cur && onPlat(cur, player.x, player.y) && pd > cur.x + cur.y) { pd = cur.x + cur.y; }
    if (next && onPlat(next, player.x, player.y) && pd > next.x + next.y) { pd = next.x + next.y; }
  }
  return pd;
}

/* ================= 彩蛋仪式动画 ================= */
// 逐字排布：按每个字符的真实测量宽度累计定位，整行严格居中（空格/标点不会撑乱间距）
function drawTrackedChars(text, cx, perChar) {
  var ws = [], total = 0, i, m, w;
  for (i = 0; i < text.length; i++) {
    m = ctx.measureText(text.charAt(i));
    w = (m && typeof m.width === 'number' && m.width > 0) ? m.width : 46;
    ws.push(w); total += w;
  }
  var x = cx - total / 2;
  for (i = 0; i < text.length; i++) {
    perChar(text.charAt(i), x + ws[i] / 2, i);
    x += ws[i];
  }
}

function drawEggOverlays() {
  var t = nowS();
  /* ---- 20 分 · 彩虹庆典 ---- */
  var e20 = t - eggFx.t20;
  if (e20 >= 0 && e20 < 2.1) {
    // 金色屏幕闪光
    if (e20 < 0.28) {
      ctx.fillStyle = 'rgba(255,236,170,' + (0.5 * (1 - e20 / 0.28)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // 三层彩虹冲击波（等距椭圆，自小猫处扩散）
    var pp = S(proj(player.x, player.y, BOX_H));
    var hues = [16, 45, 268];
    for (var i = 0; i < 3; i++) {
      var rt = e20 - i * 0.14;
      if (rt <= 0 || rt >= 0.85) { continue; }
      var u = rt / 0.85;
      var R = 26 + 250 * (1 - Math.pow(1 - u, 3));
      ctx.save();
      ctx.translate(pp.x, pp.y - 16);
      ctx.scale(1, 0.55);
      ctx.globalAlpha = (1 - u) * 0.85;
      ctx.strokeStyle = 'hsl(' + hues[i] + ',90%,62%)';
      ctx.lineWidth = 4.5 - i;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // 渐变大字弹跳入场 + 副标题
    var tu = clamp(e20 / 0.5, 0, 1);
    var sc = 0.4 + 0.6 * easeOutBack(tu);
    var ta = e20 < 1.55 ? 1 : 1 - (e20 - 1.55) / 0.55;
    ctx.save();
    ctx.translate(W / 2, H * 0.3);
    ctx.scale(sc, sc);
    ctx.globalAlpha = clamp(ta, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = '900 54px ' + FONT;
    ctx.shadowColor = 'rgba(255,140,60,0.9)';
    ctx.shadowBlur = 26;
    var tg = ctx.createLinearGradient(-140, 0, 140, 0);
    tg.addColorStop(0, '#FF8A4C');
    tg.addColorStop(0.55, '#FF5E8A');
    tg.addColorStop(1, '#A66BC9');
    ctx.fillStyle = tg;
    ctx.fillText('渐入佳境!', 0, 0);
    ctx.shadowBlur = 0;
    var subA = clamp((e20 - 0.35) / 0.4, 0, 1);
    ctx.font = '600 17px ' + FONT;
    ctx.fillStyle = 'rgba(120,88,66,' + (0.9 * subA).toFixed(3) + ')';
    ctx.fillText('手感火热 · 连击更高分', 0, 36);
    ctx.restore();
  }
  /* ---- 50 分 · 星空仪式 ---- */
  var e50 = t - eggFx.t50;
  if (e50 >= 0 && e50 < 3.6) {
    // 电影级聚光暗场：只压暗四周、中央游戏区保持可见，不会看不见下一个方块
    var da = e50 < 0.9 ? e50 / 0.9 : (e50 > 2.9 ? 1 - (e50 - 2.9) / 0.7 : 1);
    da = clamp(da, 0, 1);
    if (da > 0.01) {
      var dg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.3, W / 2, H * 0.55, Math.max(W, H) * 0.75);
      dg.addColorStop(0, 'rgba(10,8,32,' + (0.08 * da).toFixed(3) + ')');
      dg.addColorStop(1, 'rgba(10,8,32,' + (0.4 * da).toFixed(3) + ')');
      ctx.fillStyle = dg;
      ctx.fillRect(0, 0, W, H);
    }
    // 两次紫光脉冲
    for (var pi = 0; pi < 2; pi++) {
      var pt = e50 - 0.5 - pi * 0.55;
      if (pt > 0 && pt < 0.8) {
        ctx.fillStyle = 'rgba(150,110,255,' + (Math.sin(Math.PI * pt / 0.8) * 0.16).toFixed(3) + ')';
        ctx.fillRect(0, 0, W, H);
      }
    }
    var fadeAll = e50 > 3.0 ? clamp(1 - (e50 - 3.0) / 0.6, 0, 1) : 1;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 逐字弹出的发光大字（按真实字宽排布，居中不错位）
    ctx.font = '900 46px ' + FONT;
    drawTrackedChars('彩蛋 · 星空模式', W / 2, function (ch, cx, idx) {
      var ct = e50 - 0.45 - idx * 0.09;
      if (ct <= 0) { return; }
      var cu = clamp(ct / 0.34, 0, 1);
      var cs = 0.3 + 0.7 * easeOutBack(cu);
      ctx.save();
      ctx.translate(cx, H * 0.3);
      ctx.scale(cs, cs);
      ctx.globalAlpha = fadeAll * cu;
      ctx.shadowColor = 'rgba(180,150,255,0.95)';
      ctx.shadowBlur = 22;
      ctx.fillStyle = (idx % 2) ? '#E9DEFF' : '#FFF6E9';
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    });
    // 副标题淡入（与主标题拉开间距）
    var su = clamp((e50 - 1.5) / 0.5, 0, 1);
    if (su > 0) {
      ctx.globalAlpha = su * fadeAll;
      ctx.font = '600 18px ' + FONT;
      ctx.shadowColor = 'rgba(150,120,255,0.8)';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#CBB8FF';
      ctx.fillText('星河为你点亮', W / 2, H * 0.3 + 54);
    }
    ctx.restore();
    // 标题周围点缀的星光（错峰闪烁）
    for (var si2 = 0; si2 < 7; si2++) {
      var st2 = e50 - 0.5 - si2 * 0.16;
      if (st2 <= 0 || st2 >= 1.5) { continue; }
      var su2 = Math.sin(Math.PI * st2 / 1.5);
      var ang2 = si2 * 2.4;
      drawSparkle(W / 2 + Math.cos(ang2) * (150 + si2 * 24), H * 0.3 + Math.sin(ang2) * 46, 3.4 * su2 + 0.5, 'rgba(220,205,255,' + (0.85 * su2 * fadeAll).toFixed(3) + ')');
    }
  }
  /* ---- 200 分 · 超级无敌炫彩庆典 ---- */
  var e200x = t - eggFx.t200;
  if (e200x >= 0 && e200x < 4.6) {
    var env = e200x < 0.5 ? e200x / 0.5 : (e200x > 3.8 ? clamp(1 - (e200x - 3.8) / 0.8, 0, 1) : 1);
    // 开场白金闪光
    if (e200x < 0.34) {
      ctx.fillStyle = 'rgba(255,244,200,' + (0.55 * (1 - e200x / 0.34)).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    // 旋转彩虹光束（低透明度，不遮挡方块）
    ctx.save();
    ctx.translate(W / 2, H * 0.3);
    for (var bi2 = 0; bi2 < 10; bi2++) {
      var ba = t * 0.7 + bi2 * Math.PI / 5;
      ctx.save();
      ctx.rotate(ba);
      ctx.globalAlpha = 0.09 * env;
      ctx.fillStyle = 'hsl(' + ((bi2 * 36 + t * 70) % 360) + ',92%,62%)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, Math.max(W, H), -0.055, 0.055);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    // 四层彩虹冲击波（自小猫处扩散，色相流转）
    var pp2 = S(proj(player.x, player.y, BOX_H));
    for (var ri2 = 0; ri2 < 4; ri2++) {
      var rt2 = e200x - 0.1 - ri2 * 0.22;
      if (rt2 <= 0 || rt2 >= 1.1) { continue; }
      var u2 = rt2 / 1.1;
      var R2 = 30 + 430 * (1 - Math.pow(1 - u2, 3));
      ctx.save();
      ctx.translate(pp2.x, pp2.y - 16);
      ctx.scale(1, 0.55);
      ctx.globalAlpha = (1 - u2) * 0.8;
      ctx.strokeStyle = 'hsl(' + ((t * 200 + ri2 * 70) % 360) + ',95%,62%)';
      ctx.lineWidth = 5 - ri2;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(0, 0, R2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    // 烟花（加色混合更通透发光）
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var fi2 = 0; fi2 < fw.length; fi2++) {
      var f2 = fw[fi2];
      if (f2.kind === 'rocket') {
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = 'hsl(' + (((f2.hue % 360) + 360) % 360) + ',90%,72%)';
        ctx.beginPath(); ctx.arc(f2.x, f2.y, 2.6, 0, Math.PI * 2); ctx.fill();
      } else {
        var fa2 = clamp(1 - f2.age / f2.life, 0, 1);
        ctx.globalAlpha = fa2 * (0.55 + 0.45 * Math.sin(f2.age * 26 + f2.hue));
        ctx.fillStyle = 'hsl(' + (((f2.hue % 360) + 360) % 360) + ',95%,66%)';
        ctx.beginPath(); ctx.arc(f2.x, f2.y, f2.r * (0.6 + fa2), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
    // 彩带雨
    for (var ci2 = 0; ci2 < confetti200.length; ci2++) {
      var cf2 = confetti200[ci2];
      ctx.save();
      ctx.translate(cf2.x, cf2.y);
      ctx.rotate(cf2.rot);
      ctx.globalAlpha = clamp(0.25 + 0.75 * env, 0, 0.92);
      ctx.fillStyle = 'hsl(' + (((cf2.hue % 360) + 360) % 360) + ',88%,62%)';
      ctx.fillRect(-cf2.w / 2, -cf2.h / 2, cf2.w, cf2.h * (0.4 + 0.6 * Math.abs(Math.sin(cf2.rot * 1.7))));
      ctx.restore();
    }
    // 彩虹渐变大字：逐字循环变色 + 白描光辉
    var fade200 = e200x > 3.8 ? clamp(1 - (e200x - 3.8) / 0.7, 0, 1) : 1;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 56px ' + FONT;
    drawTrackedChars('200 分达成!', W / 2, function (ch, cx2, idx) {
      var ct2 = e200x - 0.25 - idx * 0.07;
      if (ct2 <= 0) { return; }
      var cu2 = clamp(ct2 / 0.32, 0, 1);
      var cs2 = 0.3 + 0.7 * easeOutBack(cu2);
      ctx.save();
      ctx.translate(cx2, H * 0.28);
      ctx.scale(cs2, cs2);
      ctx.globalAlpha = fade200 * cu2;
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 24;
      ctx.fillStyle = 'hsl(' + ((t * 150 + idx * 42) % 360) + ',95%,64%)';
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    });
    // 副标题
    var su3 = clamp((e200x - 1.1) / 0.5, 0, 1);
    if (su3 > 0) {
      ctx.globalAlpha = su3 * fade200;
      ctx.font = '700 20px ' + FONT;
      ctx.shadowColor = 'rgba(255,180,80,0.85)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#FFE9B8';
      ctx.fillText('太强了 · 你就是跳跃之神!', W / 2, H * 0.28 + 58);
    }
    ctx.restore();
  }
}

function render() {
  drawBackground();
  // 方块与角色按深度排序（先远后近）：跳过头顶时方块会正确遮挡角色
  var list = platforms.slice().sort(function (a, b) { return (b.x + b.y) - (a.x + a.y); });
  var pd = playerDepth();
  var drawn = false;
  for (var i = 0; i < list.length; i++) {
    var pf = list[i];
    if (!drawn && (pf.x + pf.y) < pd) {
      drawShadow();
      drawPlayer();
      drawn = true;
    }
    drawPlatform(pf);
    drawRingsFor(pf);
  }
  if (!drawn) {
    drawShadow();
    drawPlayer();
  }
  drawParticles();
  drawPopups();
  if (state === 'charging') { drawPowerRing(); }
  // 暗角（随昼夜过渡平滑混色）
  var nbv = nightBlend * nightBlend * (3 - 2 * nightBlend);
  var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(' + Math.round(110 - 102 * nbv) + ',' + Math.round(70 - 66 * nbv) + ',' + Math.round(50 - 22 * nbv) + ',' + (0.10 + 0.14 * nbv).toFixed(3) + ')');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
  // 彩蛋仪式动画（最上层）
  drawEggOverlays();
}

/* ================= 主循环 ================= */
var lastT = performance.now();
function frame(now) {
  var dt = clamp((now - lastT) / 1000, 0.001, 0.033);
  lastT = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

reset();
state = 'menu';
bestEl.textContent = '最佳 ' + best;
requestAnimationFrame(frame);
</script>
</body>
</html>
